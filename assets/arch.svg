<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="455" viewBox="0 0 1280 455" role="img" aria-label="Architecture: the AppKit app drives SwitcherCore (engine, account store, backups, quota client, sessions), which uses the macOS Keychain and the official Factory API">
<title>Architecture</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#160f3a"/></linearGradient>
  <linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="280" y1="0" x2="1040" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
  <clipPath id="clip"><rect width="1280" height="455" rx="22"/></clipPath>
</defs>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',Helvetica,Arial,sans-serif; }
  .flow { stroke-dasharray: 7 7; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
</style>
<g clip-path="url(#clip)">
  <rect width="1280" height="455" fill="url(#bg)"/>
  <text x="40" y="48" font-size="15" font-weight="700" letter-spacing="1.5" fill="#c4b5fd">ARCHITECTURE · 架构</text>
  <g>
  <rect x="40" y="170" width="250" height="100" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#a78bfa" stroke-opacity=".55" stroke-width="1.5"/>
  <text x="60" y="202" font-size="19" font-weight="700" fill="#ffffff">FactorySwitcher</text>
  <text x="60" y="226" font-size="14.5" fill="#cbd5e1">AppKit menu · login terminal</text>
  <text x="60" y="248" font-size="13.5" fill="#a5b4fc">菜单 · 登录终端 · 退出/重开</text>
</g><rect x="350" y="60" width="625" height="370" rx="20" fill="#8b5cf6" fill-opacity=".06" stroke="#a78bfa" stroke-opacity=".35" stroke-dasharray="6 6"/>
<text x="374" y="94" font-size="15" font-weight="700" letter-spacing="1.5" fill="#c4b5fd">SWITCHERCORE</text><g>
  <rect x="380" y="170" width="230" height="100" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.5"/>
  <text x="400" y="202" font-size="19" font-weight="700" fill="#ffffff">SwitcherEngine</text>
  <text x="400" y="226" font-size="14.5" fill="#cbd5e1">transaction + journal</text>
  <text x="400" y="248" font-size="13.5" fill="#a5b4fc">事务 + 恢复日志</text>
</g><g>
  <rect x="680" y="94" width="275" height="64" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="698" y="120" font-size="17" font-weight="650" fill="#ffffff">AccountStore</text>
  <text x="698" y="144" font-size="13.5" fill="#a5b4fc">encrypted snapshots · 加密快照</text>
</g><path class="flow" d="M610 220 C 645 220, 640 126, 672 126" fill="none" stroke="url(#ln)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><g>
  <rect x="680" y="180" width="275" height="64" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="698" y="206" font-size="17" font-weight="650" fill="#ffffff">Backups</text>
  <text x="698" y="230" font-size="13.5" fill="#a5b4fc">verify · restore · 校验 · 恢复</text>
</g><path class="flow" d="M610 220 C 645 220, 640 212, 672 212" fill="none" stroke="url(#ln)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><g>
  <rect x="680" y="266" width="275" height="64" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="698" y="292" font-size="17" font-weight="650" fill="#ffffff">QuotaClient</text>
  <text x="698" y="316" font-size="13.5" fill="#a5b4fc">limits · refresh · 额度 · 续期</text>
</g><path class="flow" d="M610 220 C 645 220, 640 298, 672 298" fill="none" stroke="url(#ln)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><g>
  <rect x="680" y="352" width="275" height="64" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="698" y="378" font-size="17" font-weight="650" fill="#ffffff">Sessions</text>
  <text x="698" y="402" font-size="13.5" fill="#a5b4fc">selected org markers · 所选会话组织标记</text>
</g><path class="flow" d="M610 220 C 645 220, 640 384, 672 384" fill="none" stroke="url(#ln)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><path class="flow" d="M290 220 H 372" fill="none" stroke="url(#ln)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><g>
  <path d="M1050 108 v58 a90 14 0 0 0 180 0 v-58" fill="#10b981" fill-opacity=".1" stroke="#34d399" stroke-opacity=".7" stroke-width="1.5"/>
  <ellipse cx="1140" cy="108" rx="90" ry="14" fill="#10b981" fill-opacity=".18" stroke="#34d399" stroke-opacity=".7" stroke-width="1.5"/>
  <text x="1140" y="150" text-anchor="middle" font-size="17" font-weight="650" fill="#d1fae5">macOS Keychain</text>
  <text x="1140" y="172" text-anchor="middle" font-size="13.5" fill="#6ee7b7">钥匙串 · keys only</text>
</g><path class="flow" d="M955 126 H 1042" fill="none" stroke="url(#ln)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><g>
  <rect x="1050" y="270" width="180" height="62" rx="31" fill="#06b6d4" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".7" stroke-width="1.5"/>
  <text x="1140" y="297" text-anchor="middle" font-size="16" font-weight="650" fill="#cffafe">Official Factory API</text>
  <text x="1140" y="318" text-anchor="middle" font-size="13.5" fill="#67e8f9">官方额度 / 续期接口</text>
</g><path class="flow" d="M955 298 H 1042" fill="none" stroke="url(#ln)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/><text x="1140" y="380" text-anchor="middle" font-size="13" fill="#94a3b8">No telemetry · 无遥测</text>
</g>
</svg>
