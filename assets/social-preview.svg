<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Factory Switcher — multi-account switcher for Factory Droid on macOS">
<title>Factory Switcher</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1022"/><stop offset=".55" stop-color="#140f35"/><stop offset="1" stop-color="#1d1147"/>
  </linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/>
  </linearGradient>
  <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
  </pattern>
  <clipPath id="clip"><rect width="1280" height="640" rx="0"/></clipPath>
</defs>
<style>text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',Helvetica,Arial,sans-serif; }</style>
<g clip-path="url(#clip)">
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <g filter="url(#blur)">
    <circle class="b1" cx="220" cy="140" r="170" fill="#7c3aed" fill-opacity=".55"/>
    <circle class="b2" cx="1080" cy="360" r="190" fill="#0891b2" fill-opacity=".45"/>
    <circle class="b3" cx="760" cy="10" r="130" fill="#db2777" fill-opacity=".28"/>
  </g>

  <!-- macOS-style menu bar -->
  <rect width="1280" height="36" fill="#ffffff" fill-opacity=".06"/>
  <rect y="36" width="1280" height="1" fill="#ffffff" fill-opacity=".08"/>
  <circle cx="26" cy="18" r="6" fill="#ff5f57"/><circle cx="46" cy="18" r="6" fill="#febc2e"/><circle cx="66" cy="18" r="6" fill="#28c840"/>
  <circle class="ring" cx="1066" cy="18" r="16" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <rect class="pill" x="1038" y="6" width="56" height="24" rx="6" fill="#a78bfa"/>
  <text x="1066" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">FS</text>
  <g fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" opacity=".85">
    <path d="M1112 16a12 12 0 0 1 16 0"/><path d="M1116 20a6 6 0 0 1 8 0"/>
  </g>
  <circle cx="1120" cy="24" r="1.6" fill="#e5e7eb"/>
  <rect x="1142" y="11" width="26" height="13" rx="3" fill="none" stroke="#e5e7eb" stroke-opacity=".85" stroke-width="1.5"/>
  <rect x="1145" y="14" width="17" height="7" rx="1.5" fill="#e5e7eb" fill-opacity=".85"/>
  <text x="1250" y="24" text-anchor="end" font-size="15" fill="#e5e7eb">9:41</text>

  <g transform="translate(0 100)">
  <!-- title block -->
  <g class="fade-up">
    <rect x="455" y="92" width="370" height="32" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="640" y="114" text-anchor="middle" font-size="15" letter-spacing=".5" fill="#c7d2fe">macOS MENU-BAR APP · 菜单栏工具</text>
  </g>
  <g class="fade-up" style="animation-delay:.15s">
    <rect x="300" y="146" width="76" height="76" rx="18" fill="url(#icon)"/>
    <rect x="300" y="146" width="76" height="38" rx="18" fill="#ffffff" fill-opacity=".12"/>
    <text x="338" y="197" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff">FS</text>
    <text x="400" y="210" font-size="72" font-weight="800" letter-spacing="-1.5" fill="url(#title)">Factory Switcher</text>
  </g>
  <g class="tag" style="animation-delay:0s">
  <text x="640" y="268" text-anchor="middle" font-size="27" font-weight="500" fill="#f5f3ff">Switch between your own Factory accounts in one click</text>
  <text x="640" y="306" text-anchor="middle" font-size="21" fill="#a5b4fc">菜单栏一键切换你自己的多个 Factory 账号</text>
</g>
  <g class="chip" style="animation-delay:0.60s">
  <rect x="126.4" y="352" width="235.9" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
  <circle cx="148.4" cy="371" r="4" fill="#34d399"/>
  <text x="160.4" y="377" font-size="17" fill="#e5e7ff">Native Swift + AppKit</text>
</g><g class="chip" style="animation-delay:0.75s">
  <rect x="376.3" y="352" width="108.2" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
  <circle cx="398.3" cy="371" r="4" fill="#34d399"/>
  <text x="410.3" y="377" font-size="17" fill="#e5e7ff">≈ 1 MB</text>
</g><g class="chip" style="animation-delay:0.90s">
  <rect x="498.5" y="352" width="206.7" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
  <circle cx="520.5" cy="371" r="4" fill="#34d399"/>
  <text x="532.5" y="377" font-size="17" fill="#e5e7ff">Zero dependencies</text>
</g><g class="chip" style="animation-delay:1.05s">
  <rect x="719.2" y="352" width="229.6" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
  <circle cx="741.2" cy="371" r="4" fill="#34d399"/>
  <text x="753.2" y="377" font-size="17" fill="#e5e7ff">Encrypted snapshots</text>
</g><g class="chip" style="animation-delay:1.20s">
  <rect x="962.8" y="352" width="190.8" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
  <circle cx="984.8" cy="371" r="4" fill="#34d399"/>
  <text x="996.8" y="377" font-size="17" fill="#e5e7ff">43 tests passing</text>
</g>
  </g>
  <rect class="shine" x="0" y="0" width="160" height="640" fill="#ffffff" fill-opacity=".035" transform="skewX(-20)"/>
</g>
</svg>
