<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Switch pipeline: confirm, quit gracefully, back up and verify, swap login, relaunch; automatic rollback on failure">
<title>Safe switch pipeline</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#160f3a"/></linearGradient>
  <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <clipPath id="clip"><rect width="1280" height="360" rx="22"/></clipPath>
</defs>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',Helvetica,Arial,sans-serif; }
  .n0 { animation: n0 8s ease-out infinite; transform-origin: 120.0px 150px; } @keyframes n0 { 0%, 6% { opacity: 0; transform: scale(.6); } 10% { opacity: 1; transform: scale(1.12); } 14%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } } .n1 { animation: n1 8s ease-out infinite; transform-origin: 380.0px 150px; } @keyframes n1 { 0%, 22% { opacity: 0; transform: scale(.6); } 26% { opacity: 1; transform: scale(1.12); } 30%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } } .n2 { animation: n2 8s ease-out infinite; transform-origin: 640.0px 150px; } @keyframes n2 { 0%, 38% { opacity: 0; transform: scale(.6); } 42% { opacity: 1; transform: scale(1.12); } 46%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } } .n3 { animation: n3 8s ease-out infinite; transform-origin: 900.0px 150px; } @keyframes n3 { 0%, 54% { opacity: 0; transform: scale(.6); } 58% { opacity: 1; transform: scale(1.12); } 62%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } } .n4 { animation: n4 8s ease-out infinite; transform-origin: 1160.0px 150px; } @keyframes n4 { 0%, 70% { opacity: 0; transform: scale(.6); } 74% { opacity: 1; transform: scale(1.12); } 78%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .track { stroke-dasharray: 1040; animation: track 8s ease-in-out infinite; }
  @keyframes track { 0%, 6% { stroke-dashoffset: 1040; } 74% { stroke-dashoffset: 0; } 92% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  .rb { stroke-dasharray: 8 8; animation: rb 1.2s linear infinite; }
  @keyframes rb { to { stroke-dashoffset: -32; } }
</style>
<g clip-path="url(#clip)">
  <rect width="1280" height="360" fill="url(#bg)"/>
  <text x="40" y="48" font-size="15" font-weight="700" letter-spacing="1.5" fill="#c4b5fd">WHAT HAPPENS WHEN YOU CLICK AN ACCOUNT · 点击账号后发生什么</text>
  <line x1="120" y1="150" x2="1160" y2="150" stroke="#ffffff" stroke-opacity=".1" stroke-width="4" stroke-linecap="round"/>
  <line class="track" x1="120" y1="150" x2="1160" y2="150" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <path class="rb" d="M900.0 194 C 900.0 325, 380.0 325, 380.0 270" fill="none" stroke="#fb7185" stroke-opacity=".75" stroke-width="2.2" transform="translate(0 0)" opacity="0"/>
  <g>
  <circle cx="120.0" cy="150" r="34" fill="#1e1b4b" stroke="#ffffff" stroke-opacity=".15" stroke-width="2"/>
  <g class="n0"><circle cx="120.0" cy="150" r="34" fill="url(#node)"/><circle cx="120.0" cy="150" r="44" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="2"/></g>
  <path d="M110.0 150l6 7 14-15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120.0" y="226" text-anchor="middle" font-size="20" font-weight="650" fill="#ffffff">Confirm</text>
  <text x="120.0" y="254" text-anchor="middle" font-size="17" fill="#a5b4fc">确认</text>
</g><g>
  <circle cx="380.0" cy="150" r="34" fill="#1e1b4b" stroke="#ffffff" stroke-opacity=".15" stroke-width="2"/>
  <g class="n1"><circle cx="380.0" cy="150" r="34" fill="url(#node)"/><circle cx="380.0" cy="150" r="44" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="2"/></g>
  <path d="M380.0 137v10M371.0 142a12 12 0 1 0 18 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="380.0" y="226" text-anchor="middle" font-size="20" font-weight="650" fill="#ffffff">Quit gracefully</text>
  <text x="380.0" y="254" text-anchor="middle" font-size="17" fill="#a5b4fc">正常退出 Factory</text>
</g><g>
  <circle cx="640.0" cy="150" r="34" fill="#1e1b4b" stroke="#ffffff" stroke-opacity=".15" stroke-width="2"/>
  <g class="n2"><circle cx="640.0" cy="150" r="34" fill="url(#node)"/><circle cx="640.0" cy="150" r="44" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="2"/></g>
  <path d="M640.0 136l11 5v7c0 7-5 11-11 14-6-3-11-7-11-14v-7z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
  <text x="640.0" y="226" text-anchor="middle" font-size="20" font-weight="650" fill="#ffffff">Back up &amp; verify</text>
  <text x="640.0" y="254" text-anchor="middle" font-size="17" fill="#a5b4fc">备份并校验</text>
</g><g>
  <circle cx="900.0" cy="150" r="34" fill="#1e1b4b" stroke="#ffffff" stroke-opacity=".15" stroke-width="2"/>
  <g class="n3"><circle cx="900.0" cy="150" r="34" fill="url(#node)"/><circle cx="900.0" cy="150" r="44" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="2"/></g>
  <path d="M888.0 145h20l-5-5M912.0 155h-20l5 5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="900.0" y="226" text-anchor="middle" font-size="20" font-weight="650" fill="#ffffff">Swap login</text>
  <text x="900.0" y="254" text-anchor="middle" font-size="17" fill="#a5b4fc">替换加密登录</text>
</g><g>
  <circle cx="1160.0" cy="150" r="34" fill="#1e1b4b" stroke="#ffffff" stroke-opacity=".15" stroke-width="2"/>
  <g class="n4"><circle cx="1160.0" cy="150" r="34" fill="url(#node)"/><circle cx="1160.0" cy="150" r="44" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="2"/></g>
  <path d="M1170.0 146a11 11 0 1 1-4-8M1171.0 135v7h-7" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1160.0" y="226" text-anchor="middle" font-size="20" font-weight="650" fill="#ffffff">Relaunch</text>
  <text x="1160.0" y="254" text-anchor="middle" font-size="17" fill="#a5b4fc">重新打开</text>
</g>
  <g>
    <rect x="220.0" y="308" width="840" height="36" rx="18" fill="#fb7185" fill-opacity=".1" stroke="#fb7185" stroke-opacity=".4"/>
    <text x="640.0" y="332" text-anchor="middle" font-size="16" fill="#fecdd3">✕ Any step fails → roll back &amp; reopen the original · 任一步失败 → 回滚并重新打开原账号</text>
  </g>
</g>
</svg>
